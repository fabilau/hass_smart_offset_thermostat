name: Build ZIP & Create Draft Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ ! "$TAG" =~ ^v.+ ]]; then
            echo "Invalid tag: $TAG"
            echo "Tag must start with 'v', e.g. v1.2.0"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Build ZIP
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/smart_offset_thermostat"

          zip -r "${GITHUB_WORKSPACE}/smart_offset_thermostat.zip" . \
            -x "**/__pycache__/*" \
            -x "**/*.pyc"

      - name: Create/Update Draft Release + upload asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}

          # Bei manuellem Start wird ein noch nicht existierender Tag
          # auf dem aktuell ausgecheckten Commit angelegt.
          commit: ${{ github.sha }}

          draft: true
          generateReleaseNotes: false

          artifacts: "smart_offset_thermostat.zip"
          artifactContentType: application/zip

          allowUpdates: true
          replacesArtifacts: true

          token: ${{ secrets.GITHUB_TOKEN }}
